[project]
name = "petstore-web"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "starlette>=1.6.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
    "httpx2>=2.12.0",
    "petstore-api",
    "petstore-cli",
]

[tool.uv.sources]
petstore-api = { workspace = true }
petstore-cli = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/petstore_web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
