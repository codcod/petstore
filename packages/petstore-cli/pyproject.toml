[project]
name = "petstore-cli"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx2>=2.12.0",
]

[project.scripts]
petstore-cli = "petstore_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/petstore_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
