name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.2.3"
        required: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package versions match the tag
        run: |
          for pkg in petstore-api petstore-web petstore-cli; do
            declared=$(grep -m1 '^version = ' "packages/$pkg/pyproject.toml" | cut -d'"' -f2)
            if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
              echo "::error::packages/$pkg/pyproject.toml is at $declared, tag is ${{ steps.version.outputs.version }} — bump it and re-tag."
              exit 1
            fi
          done

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint, type-check
        run: |
          uv sync --group dev --all-packages
          uv run --group dev ruff check packages tests
          uv run --group dev ruff format --check packages tests
          uv run --group dev ty check packages

      - name: Integration tests
        run: |
          docker compose build
          docker compose run --rm migrate
          docker compose run --rm test
          docker compose down -v

      - name: Build wheels/sdists
        run: |
          uv build --package petstore-api
          uv build --package petstore-web
          uv build --package petstore-cli

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Build and push image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
      #       ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/*
