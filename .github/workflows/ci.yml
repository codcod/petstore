name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --all-packages
      - run: uv run --group dev ruff check packages tests
      - run: uv run --group dev ruff format --check packages tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --all-packages
      - run: uv run --group dev ty check packages

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --all-packages
      - env:
          DATABASE_URL: postgresql+asyncpg://unit:test@unused/unit
        run: >
          uv run --group dev python -m unittest
          tests.test_pets_helpers tests.test_petstore_web_helpers
          tests.test_logging tests.test_petstore_cli -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm migrate
      - run: docker compose run --rm test
      - if: always()
        run: docker compose down -v

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest .
      - run: ./actionlint -color
