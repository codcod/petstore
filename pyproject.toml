[project]
name = "templ"
version = "0.1.1"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "alembic>=1.13",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
root = [
  "packages/petstore-api/src",
  "packages/petstore-web/src",
  "packages/petstore-cli/src"
]
